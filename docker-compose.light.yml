# Meatapivot 轻量开发环境
# 仅包含核心服务（PostgreSQL + Neo4j + Redis + Backend + Frontend）
# 适用于本地日常开发，启动快、资源占用低
#
# 使用方法：
#   docker-compose -f docker-compose.light.yml up -d
#
# 与完整版的区别：
#   - 无 Milvus（向量搜索降级为纯 Neo4j 检索）
#   - 无可观测性栈（Prometheus/Grafana/Loki/Tempo）
#   - 无 Keycloak（使用后端内置 JWT 认证）
#   - 无 RabbitMQ（Action 异步执行降级为同步）
#   - 无 MinIO（文件上传功能不可用）

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: meatapivot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledge123}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meatapivot-network

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.15
    container_name: meatapivot-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/neo4j123}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.*'
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meatapivot-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: meatapivot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - meatapivot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meatapivot-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-knowledge}:${POSTGRES_PASSWORD:-knowledge123}@postgres:5432/${POSTGRES_DB:-knowledge_db}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: neo4j123
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      # Milvus disabled in light mode - semantic search falls back to graph-only
      MILVUS_URI: ""
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - meatapivot-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (Vite + React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meatapivot-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - meatapivot-network
    command: npm run dev -- --host 0.0.0.0 --port 3000

volumes:
  postgres_data:
  neo4j_data:
  redis_data:

networks:
  meatapivot-network:
    driver: bridge
