apiVersion: v1
kind: Service
metadata:
  name: {{ include "kdp.fullname" . }}-backend
  labels:
    {{- include "kdp.backendLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "kdp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
