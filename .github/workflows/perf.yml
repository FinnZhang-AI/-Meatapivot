name: Performance Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'  # Weekly on Sunday 4 AM

jobs:
  k6-smoke:
    name: k6 Smoke Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: knowledge
          POSTGRES_PASSWORD: knowledge123
          POSTGRES_DB: knowledge_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowledge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://knowledge:knowledge123@localhost:5432/knowledge_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key
        run: alembic upgrade head

      - name: Start backend in background
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://knowledge:knowledge123@localhost:5432/knowledge_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -s http://localhost:8000/health || (echo "Backend failed to start" && exit 1)

      - name: Run k6 smoke test
        run: |
          docker run --rm -v $(pwd):/workdir -w /workdir \
            --network host \
            grafana/k6:latest run tests/k6/smoke-test.js

  k6-load:
    name: k6 Load Test (100 VU)
    runs-on: ubuntu-latest
    needs: k6-smoke

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: knowledge
          POSTGRES_PASSWORD: knowledge123
          POSTGRES_DB: knowledge_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowledge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://knowledge:knowledge123@localhost:5432/knowledge_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key
        run: alembic upgrade head

      - name: Start backend in background
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://knowledge:knowledge123@localhost:5432/knowledge_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -s http://localhost:8000/health || (echo "Backend failed to start" && exit 1)

      - name: Run k6 load test
        run: |
          docker run --rm -v $(pwd):/workdir -w /workdir \
            --network host \
            grafana/k6:latest run tests/k6/load-test-read.js
